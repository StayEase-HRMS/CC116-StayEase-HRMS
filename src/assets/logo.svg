<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 190" width="940" height="380" role="img" aria-label="StayEase Hospitality Suite" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C45E"/>
      <stop offset="1" stop-color="#C98A1B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>


  <!-- Icon tile -->
  <rect x="22" y="23" width="144" height="144" rx="36" fill="url(#gold)"/>
  <rect x="22" y="23" width="144" height="144" rx="36" fill="url(#shine)"/>

  <!-- House silhouette -->
  <path d="M94 57 L142 98 V138 a6 6 0 0 1 -6 6 H52 a6 6 0 0 1 -6 -6 V98 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>

  <!-- Arched welcoming door -->
  <path d="M80 144 V117 a14 14 0 0 1 28 0 V144 Z" fill="#B97A12"/>
  <circle cx="102" cy="132" r="2.4" fill="#F2C45E"/>

  <!-- Wordmark -->
  <text x="190" y="102" font-family="Poppins, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-1" textLength="244" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#14213D">Stay</tspan><tspan fill="#C98A1B">Ease</tspan>
  </text>

  <!-- Divider + tagline -->
  <rect x="192" y="118" width="40" height="3" rx="1.5" fill="#C98A1B"/>
  <text x="191" y="145" font-family="Poppins, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="600" fill="#4A5568" letter-spacing="4.2"
        textLength="243" lengthAdjust="spacing">HOSPITALITY SUITE</text>
</svg>
